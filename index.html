<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CPO Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Калькулятор потребительского кредита</h1>
    <h3>*расчеты по методике СберБанка РФ</h3>

    <div class="calculator">
        <label for="salary">Расчет чистого ежемесячного дохода</label>
        <input type="number" id="salary" placeholder="Ваша зарплата за 6 месяцев">
        <button onclick="calculate()">Вычислить</button>
        <p id="result"></p>
    </div>

    <div class="calculator">
        <label for="term">Расчет платежеспособности</label>
        <input type="number" id="term" placeholder="Срок кредита (в месяцах)">
        <button onclick="calculateAbility()">Вычислить</button>
        <p id="ability"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
